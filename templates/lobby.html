<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Лобби игр</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .lobby-container { max-width: 600px; margin: 50px auto; text-align: center; }
        .game-card { background: #f9f9f9; border: 1px solid #ddd; padding: 15px; margin: 10px 0; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .btn-join { padding: 8px 16px; background-color: #2196F3; color: white; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; }
        .btn-join:hover { background-color: #0b7dda; }
        .empty-message { color: gray; font-size: 18px; margin-top: 30px; }
    </style>
</head>
<body>
    <div class="lobby-container">
        <h1>👀 Лобби игр (PvP)</h1>
        <p>Доступно игр: <strong>{{ games|length }}</strong> (ожидают второго игрока)</p>

        {% if games %}
            {% for game in games %}
                <div class="game-card">
                    <div>
                        <strong>Игра #{{ loop.index }}</strong><br>
                        <small>UUID: {{ game.uuid }}</small>
                    </div>
                    <button class="btn-join" data-uuid="{{ game.uuid }}">
                        👥 Присоединиться
                    </button>
                </div>
            {% endfor %}
        {% else %}
            <p class="empty-message">В данный момент нет игр, ожидающих второго игрока.</p>
        {% endif %}

        <br>
        <a href="/games/new">➕ Создать новую игру</a> |
        <a href="/">🏠 На главную</a>
    </div>

    <script>
        // Просто обрабатываем клики по кнопкам "Присоединиться"
        const joinButtons = document.querySelectorAll('.btn-join');
        joinButtons.forEach(button => {
            button.addEventListener('click', async function() {
                const gameUuid = this.dataset.uuid;

                try {
                    const response = await fetch(`/games/${gameUuid}/join`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        }
                    });

                    if (response.ok) {
                        // Успешно присоединились — переходим на страницу игры
                        window.location.href = `/game/${gameUuid}`;
                    } else if (response.status === 401) {
                        // Не авторизован — перенаправляем на логин
                        alert("Для присоединения к игре нужно войти в систему");
                        window.location.href = '/auth/login';
                    } else {
                        const error = await response.json();
                        alert("Ошибка: " + (error.detail || "Не удалось присоединиться"));
                    }
                } catch (e) {
                    alert("Ошибка сети");
                }
            });
        });
    </script>
</body>
</html>
