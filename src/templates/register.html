<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .register-container {
            max-width: 400px;
            margin: 50px auto;
            padding: 30px;
            border: 2px solid #333;
            border-radius: 10px;
            text-align: center;
        }
        .register-container input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
        }
        .register-container button {
            width: 100%;
            padding: 12px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 10px;
        }
        .register-container button:hover {
            background-color: #45a049;
        }
        .error-message {
            color: red;
            margin-top: 10px;
        }
        .success-message {
            color: green;
            margin-top: 10px;
        }
        .links {
            margin-top: 20px;
        }
        .links a {
            color: #2196F3;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="register-container">
        <h1> Регистрация</h1>
        <form id="registerForm">
            <input type="text" id="login" placeholder="Логин" required>
            <input type="password" id="password" placeholder="Пароль (минимум 6 символов)" required>
            <button type="submit">Зарегистрироваться</button>
        </form>
        <div id="message"></div>
        <div class="links">
            <p>Уже есть аккаунт? <a href="/auth/login">Войти</a></p>
            <p><a href="/">← На главную</a></p>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const login = document.getElementById('login').value;
            const password = document.getElementById('password').value;
            const messageDiv = document.getElementById('message');

            try {
                const response = await fetch('/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ login, password })
                });

                if (response.ok) {
                    messageDiv.className = 'success-message';
                    messageDiv.textContent = ' Регистрация успешна! Перенаправляем на главную...';
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 1500);
                } else {
                    const error = await response.json();
                    messageDiv.className = 'error-message';
                    messageDiv.textContent = error.detail || 'Ошибка регистрации';
                }
            } catch (e) {
                messageDiv.className = 'error-message';
                messageDiv.textContent = 'Ошибка сети';
            }
        });
    </script>
</body>
</html>
